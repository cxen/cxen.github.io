project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"

website:
  title: "Constantinos Xenophontos"
  description: "Microbial ecologist studying bacterial growth, interactions and antibiotic tolerance."
  site-url: https://cxen.github.io
  repo-url: https://github.com/cxen/cxen.github.io
  open-graph: true
  navbar:
    pinned: true
    left:
      - text: About
        href: index.qmd
      - text: Publications
        href: publications.qmd
      - text: Software
        href: software.qmd
      - text: CV
        href: cv.qmd
    right:
      - icon: github
        href: https://github.com/cxen
        aria-label: GitHub
      - text: "{{< ai orcid >}}"
        href: https://orcid.org/0000-0001-9340-9566
        aria-label: ORCID
      - text: "{{< ai google-scholar >}}"
        href: https://scholar.google.com/citations?user=dGgTnyUAAAAJ
        aria-label: Google Scholar
      - icon: envelope
        href: "#email"   # resolved to a mailto: by assets/email.html
        aria-label: Email
  page-footer:
    left: "© 2026 Constantinos Xenophontos"
    right: "Built with [Quarto](https://quarto.org) · [Source](https://github.com/cxen/cxen.github.io)"

bibliography: references.bib
csl: assets/apa-cv.csl

format:
  html:
    theme:
      light: [flatly, custom.scss]
      dark: [darkly, custom.scss]
    toc: false
    link-external-newwindow: true
    include-after-body: assets/email.html
    smooth-scroll: true
